                    color: "#000",
                    weight: 0.5,
                    opacity: 1,
                    fillOpacity: 0.8
                });
            },
            filter: function(feature) {
                var isVisible = selectedBatches.includes(feature.properties.batch_id);

        countDisplay.innerHTML = visibleCount.toLocaleString();
